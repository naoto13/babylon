<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050914" />
    <meta name="description" content="Chrono Arena の実機ライティング用 GLB プレビュー" />
    <title>Chrono Arena — Asset Preview</title>
    <style>
      :root {
        color-scheme: dark;
        font: 100%/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #050914;
      }

      * { box-sizing: border-box; }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow: hidden;
        background: #050914;
        color: #eef8ff;
      }

      #render-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        outline: none;
        touch-action: none;
      }

      .preview-panel {
        position: fixed;
        top: max(1rem, env(safe-area-inset-top));
        left: max(1rem, env(safe-area-inset-left));
        z-index: 1;
        width: min(26rem, calc(100vw - 2rem));
        padding: 0.9rem 1rem;
        border: 1px solid rgb(185 231 255 / 0.28);
        border-radius: 0.85rem;
        background: rgb(6 16 31 / 0.78);
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 0.26);
        backdrop-filter: blur(18px) saturate(150%);
      }

      .preview-panel h1 {
        margin: 0;
        color: #f3fbff;
        font-size: 0.94rem;
        font-weight: 720;
        letter-spacing: -0.012em;
      }

      .preview-panel p {
        margin: 0.28rem 0 0;
        color: #a9c2d4;
        font-size: 0.75rem;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.55rem;
        margin-top: 0.75rem;
      }

      label {
        display: grid;
        gap: 0.22rem;
        color: #b9d4e8;
        font-size: 0.68rem;
        font-weight: 650;
        letter-spacing: 0.045em;
      }

      select {
        width: 100%;
        min-height: 2.2rem;
        border: 1px solid rgb(183 230 255 / 0.26);
        border-radius: 0.52rem;
        padding: 0.25rem 0.5rem;
        background: rgb(16 37 60 / 0.9);
        color: #f4fbff;
        font: inherit;
      }

      select:focus-visible {
        outline: 2px solid #7ce3ff;
        outline-offset: 2px;
      }

      .status {
        min-height: 1.2rem;
        margin-top: 0.7rem !important;
        color: #d5ecfb !important;
        font-variant-numeric: tabular-nums;
      }

      .status[data-state="error"] { color: #ff9eac !important; }

      @media (prefers-reduced-transparency: reduce) {
        .preview-panel {
          background: #071426;
          backdrop-filter: none;
        }
      }

      @media (max-width: 520px) {
        .controls { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <canvas id="render-canvas" aria-label="Chrono Arena のアセットプレビュー"></canvas>
    <aside class="preview-panel" aria-label="アセットプレビュー設定">
      <h1>CHRONO ARENA / ASSET PREVIEW</h1>
      <p>本編と同じアリーナ・ライティング条件を、近接カメラで確認します。</p>
      <p><a href="./effect-preview.html">エフェクト素材プレビューを開く</a></p>
      <div class="controls">
        <label>
          MODEL
          <select id="model-select" aria-label="表示するモデル">
            <option value="hero">Hero</option>
            <option value="chaser">Chaser</option>
            <option value="shooter">Shooter</option>
            <option value="thief">Thief</option>
            <option value="boss">Boss</option>
            <option value="all">All (5)</option>
          </select>
        </label>
        <label>
          SET
          <select id="set-select" aria-label="比較するモデルセット">
            <option value="trellis2">TRELLIS.2 GLB</option>
            <option value="packed">TRELLIS.2 packed (in-game)</option>
            <option value="new">SPAR3D nendo GLB</option>
            <option value="old">Current game GLB</option>
          </select>
        </label>
        <label>
          VIEW
          <select id="view-select" aria-label="カメラアングル">
            <option value="front">Front</option>
            <option value="game">Game (俯瞰)</option>
            <option value="side">Side</option>
            <option value="back">Back</option>
            <option value="turntable">Turntable</option>
          </select>
        </label>
        <label>
          MOTION
          <select id="motion-select" aria-label="再生するアニメーション">
            <option value="none">None (rest)</option>
            <option value="Idle">Idle</option>
            <option value="Run">Run (hero)</option>
            <option value="Move">Move (enemy)</option>
            <option value="Attack">Attack</option>
            <option value="Dash">Dash (hero)</option>
            <option value="Hit">Hit</option>
            <option value="Death">Death (enemy)</option>
            <option value="FutureSlash">FutureSlash (hero)</option>
          </select>
        </label>
      </div>
      <p id="status" class="status" aria-live="polite">シーンを準備中…</p>
    </aside>
    <script type="module" src="./asset-preview.js"></script>
  </body>
</html>
